<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 112" width="430" height="112" fill="none">
  <defs>
    <!-- 3D Spherical Depth Gradient for Main Globe -->
    <radialGradient id="tn-globe-l" cx="35%" cy="28%" r="72%" fx="32%" fy="24%">
      <stop offset="0%" stop-color="#FF6B7A"/>
      <stop offset="42%" stop-color="#E11D2E"/>
      <stop offset="82%" stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#6B0F1A"/>
    </radialGradient>

    <!-- Matching 3D Spherical Depth Gradient for Satellite Orb -->
    <radialGradient id="tn-orb-l" cx="34%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#FF8A95"/>
      <stop offset="48%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </radialGradient>

    <!-- Seamless Depth Gradients for Back & Front Orbit -->
    <linearGradient id="tn-orbit-back-l" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7F1120"/>
      <stop offset="55%" stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#E11D2E"/>
    </linearGradient>
    <linearGradient id="tn-orbit-front-l" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#88131D"/>
      <stop offset="45%" stop-color="#E11D2E"/>
      <stop offset="100%" stop-color="#FF5C6C"/>
    </linearGradient>

    <linearGradient id="tn-word-red-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>

    <!-- Clean transparent gap in back orbit so the 3D satellite orb integrates seamlessly -->
    <mask id="tn-orb-gap-l">
      <rect x="-55" y="-55" width="110" height="110" fill="white"/>
      <circle cx="30" cy="-9.9" r="8.2" fill="black"/>
    </mask>
  </defs>

  <!-- Brand Mark: 3D Depth Orbital Globe -->
  <g transform="translate(56, 56)">
    <!-- Back Orbit Ring (darker depth shade) -->
    <g transform="rotate(-28)">
      <path d="M -40 0 A 40 15 0 0 1 40 0"
            stroke="url(#tn-orbit-back-l)"
            stroke-width="6.2"
            stroke-linecap="round"
            mask="url(#tn-orb-gap-l)"
            fill="none"/>
    </g>

    <!-- Central 3D Red Globe -->
    <circle cx="0" cy="0" r="22.5" fill="url(#tn-globe-l)"/>
    <!-- Subtle Specular Highlight Arc -->
    <path d="M -12 -10.5 A 15.5 15.5 0 0 1 11.5 -11"
          stroke="#FFE4E6"
          stroke-width="2.6"
          stroke-linecap="round"
          opacity="0.55"
          fill="none"/>

    <!-- Front Orbit Ring (lit foreground depth) + Integrated 3D Satellite Orb -->
    <g transform="rotate(-28)">
      <path d="M 40 0 A 40 15 0 0 1 -40 0"
            stroke="url(#tn-orbit-front-l)"
            stroke-width="6.5"
            stroke-linecap="round"
            fill="none"/>
      <!-- 3D Shaded Satellite Orb seated cleanly in the orbital track -->
      <circle cx="30" cy="-9.9" r="5.4" fill="url(#tn-orb-l)"/>
      <circle cx="28.3" cy="-11.4" r="1.4" fill="#FFE4E6" opacity="0.6"/>
    </g>
  </g>

  <!-- Horizontal Wordmark -->
  <g transform="translate(108, 66)">
    <text font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="48"
          font-weight="800"
          letter-spacing="-1.4">
      <tspan fill="#0F172A">Telco</tspan><tspan fill="url(#tn-word-red-l)">Nusa</tspan>
    </text>
    <text x="2" y="21"
          font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="11"
          font-weight="600"
          letter-spacing="3.4"
          fill="#64748B">CONNECTING NUSANTARA</text>
  </g>
</svg>
