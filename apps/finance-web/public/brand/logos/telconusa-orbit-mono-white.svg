<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 112" width="430" height="112" fill="none">
  <defs>
    <!-- Subtle transparent cutout on globe for monochrome legibility + gap around satellite orb -->
    <mask id="tn-orb-gap-mw">
      <rect x="-55" y="-55" width="110" height="110" fill="white"/>
      <circle cx="30" cy="-9.9" r="8.2" fill="black"/>
    </mask>
    <mask id="tn-globe-front-mw">
      <rect x="-55" y="-55" width="110" height="110" fill="white"/>
      <g transform="rotate(-28)">
        <path d="M 40 0 A 40 15 0 0 1 -40 0"
              stroke="black" stroke-width="11" stroke-linecap="round" fill="none"/>
      </g>
    </mask>
  </defs>

  <g transform="translate(56, 56)">
    <g transform="rotate(-28)">
      <path d="M -40 0 A 40 15 0 0 1 40 0"
            stroke="#FFFFFF"
            stroke-width="6"
            stroke-linecap="round"
            opacity="0.55"
            mask="url(#tn-orb-gap-mw)"
            fill="none"/>
    </g>
    <circle cx="0" cy="0" r="22.5" fill="#FFFFFF" mask="url(#tn-globe-front-mw)"/>
    <g transform="rotate(-28)">
      <path d="M 40 0 A 40 15 0 0 1 -40 0"
            stroke="#FFFFFF"
            stroke-width="6.5"
            stroke-linecap="round"
            fill="none"/>
      <circle cx="30" cy="-9.9" r="5.4" fill="#FFFFFF"/>
    </g>
  </g>

  <g transform="translate(108, 66)">
    <text font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="48"
          font-weight="800"
          letter-spacing="-1.4"
          fill="#FFFFFF">TelcoNusa</text>
    <text x="2" y="21"
          font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="11"
          font-weight="600"
          letter-spacing="3.4"
          fill="#FFFFFF"
          opacity="0.82">CONNECTING NUSANTARA</text>
  </g>
</svg>
