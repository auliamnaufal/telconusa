        '403':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Format galat baku
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: object
                    properties:
                      sku:
                        type: string
                      requested:
                        type: integer
                      available:
                        type: integer
                    required:
                    - sku
                    - requested
                    - available
                  correlation_id:
                    type: string
                required:
                - code
                - message
                - details
            required:
            - error
          example:
            error:
              code: INSUFFICIENT_STOCK
              message: Stok ONT-01 di gudang Bandung tidak cukup
              details:
                sku: ONT-01
                requested: 1
                available: 0
              correlation_id: ORD-2026-000123
