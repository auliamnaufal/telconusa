# ==============================================================================
# PT TelkoNusa Digital - Docker Compose
#
# Sebelum menjalankan, buat .env berisi secret dengan: tools/setup-env.sh
#
# Setiap kelompok cukup menjalankan service miliknya sendiri, dan memakai mock
# (Prism, dari contracts/openapi) untuk service kelompok lain via profile "mock":
#
#   SCM_API_URL_INTERNAL=http://mock-scm:4010 \
#     docker compose --profile mock up mysql crm-api mock-scm
#
# Variabel *_API_URL_INTERNAL (CRM, HRM, SCM, FINANCE) mengarahkan service ke
# mock atau ke API sungguhan. Detail: mock/README.md
# ==============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: telconusa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-telconusa_root}
      MYSQL_USER: ${MYSQL_USER:-telconusa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-telconusa123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-telconusa_root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- 4 Division FastAPI Backends ---
  crm-api:
    build: { context: ./services, dockerfile: crm-api/Dockerfile }
    container_name: telconusa-crm-api
    restart: unless-stopped
    ports: ["8001:8001"]
    environment:
      DATABASE_URL: mysql+pymysql://telconusa:telconusa123@mysql:3306/telconusa_crm
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - run tools/setup-env.sh}
      HMAC_WEBHOOK_SECRET: ${HMAC_WEBHOOK_SECRET:?HMAC_WEBHOOK_SECRET is required - run tools/setup-env.sh}
      EVENT_TRANSPORT: ${EVENT_TRANSPORT:-webhook}
      HRM_API_URL: ${HRM_API_URL_INTERNAL:-http://hrm-api:8002}
      SCM_API_URL: ${SCM_API_URL_INTERNAL:-http://scm-api:8003}
      FINANCE_API_URL: ${FINANCE_API_URL_INTERNAL:-http://finance-api:8004}
    depends_on:
      mysql: { condition: service_healthy }

  hrm-api:
    build: { context: ./services, dockerfile: hrm-api/Dockerfile }
    container_name: telconusa-hrm-api
    restart: unless-stopped
    ports: ["8002:8002"]
    environment:
      DATABASE_URL: mysql+pymysql://telconusa:telconusa123@mysql:3306/telconusa_hrm
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - run tools/setup-env.sh}
      HMAC_WEBHOOK_SECRET: ${HMAC_WEBHOOK_SECRET:?HMAC_WEBHOOK_SECRET is required - run tools/setup-env.sh}
      EVENT_TRANSPORT: ${EVENT_TRANSPORT:-webhook}
      CRM_API_URL: ${CRM_API_URL_INTERNAL:-http://crm-api:8001}
      SCM_API_URL: ${SCM_API_URL_INTERNAL:-http://scm-api:8003}
      FINANCE_API_URL: ${FINANCE_API_URL_INTERNAL:-http://finance-api:8004}
    depends_on:
      mysql: { condition: service_healthy }

  scm-api:
    build: { context: ./services, dockerfile: scm-api/Dockerfile }
    container_name: telconusa-scm-api
    restart: unless-stopped
    ports: ["8003:8003"]
    environment:
      DATABASE_URL: mysql+pymysql://telconusa:telconusa123@mysql:3306/telconusa_scm
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - run tools/setup-env.sh}
      HMAC_WEBHOOK_SECRET: ${HMAC_WEBHOOK_SECRET:?HMAC_WEBHOOK_SECRET is required - run tools/setup-env.sh}
      EVENT_TRANSPORT: ${EVENT_TRANSPORT:-webhook}
      CRM_API_URL: ${CRM_API_URL_INTERNAL:-http://crm-api:8001}
      HRM_API_URL: ${HRM_API_URL_INTERNAL:-http://hrm-api:8002}
      FINANCE_API_URL: ${FINANCE_API_URL_INTERNAL:-http://finance-api:8004}
    depends_on:
      mysql: { condition: service_healthy }

  finance-api:
    build: { context: ./services, dockerfile: finance-api/Dockerfile }
    container_name: telconusa-finance-api
    restart: unless-stopped
    ports: ["8004:8004"]
    environment:
      DATABASE_URL: mysql+pymysql://telconusa:telconusa123@mysql:3306/telconusa_finance
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - run tools/setup-env.sh}
      HMAC_WEBHOOK_SECRET: ${HMAC_WEBHOOK_SECRET:?HMAC_WEBHOOK_SECRET is required - run tools/setup-env.sh}
      EVENT_TRANSPORT: ${EVENT_TRANSPORT:-webhook}
      CRM_API_URL: ${CRM_API_URL_INTERNAL:-http://crm-api:8001}
      HRM_API_URL: ${HRM_API_URL_INTERNAL:-http://hrm-api:8002}
      SCM_API_URL: ${SCM_API_URL_INTERNAL:-http://scm-api:8003}
    depends_on:
      mysql: { condition: service_healthy }

  # --- Public Customer-Only Storefront & Self-Service (:3000) ---
  web:
    build: { context: ./apps/web, dockerfile: Dockerfile }
    container_name: telconusa-customer-web
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_CRM_API_URL: http://localhost:8001
      NEXT_PUBLIC_HRM_API_URL: http://localhost:8002
    depends_on: [crm-api, hrm-api]

  # --- 4 Standalone Internal Division Web Apps (:3001 - :3004) ---
  crm-web:
    build: { context: ./apps/crm-web, dockerfile: Dockerfile }
    container_name: telconusa-crm-web
    restart: unless-stopped
    ports: ["3001:3001"]
    environment:
      NEXT_PUBLIC_CRM_API_URL: http://localhost:8001
      NEXT_PUBLIC_HRM_API_URL: http://localhost:8002
      NEXT_PUBLIC_SCM_API_URL: http://localhost:8003
      NEXT_PUBLIC_FINANCE_API_URL: http://localhost:8004
      NEXT_PUBLIC_HRM_WEB_URL: http://localhost:3002
    depends_on: [crm-api, hrm-api, scm-api, finance-api]

  hrm-web:
    build: { context: ./apps/hrm-web, dockerfile: Dockerfile }
    container_name: telconusa-hrm-web
    restart: unless-stopped
    ports: ["3002:3002"]
    environment:
      NEXT_PUBLIC_HRM_API_URL: http://localhost:8002
    depends_on: [hrm-api]

  scm-web:
    build: { context: ./apps/scm-web, dockerfile: Dockerfile }
    container_name: telconusa-scm-web
    restart: unless-stopped
    ports: ["3003:3003"]
    environment:
      NEXT_PUBLIC_SCM_API_URL: http://localhost:8003
      NEXT_PUBLIC_HRM_API_URL: http://localhost:8002
      NEXT_PUBLIC_HRM_WEB_URL: http://localhost:3002
    depends_on: [scm-api, hrm-api]

  finance-web:
    build: { context: ./apps/finance-web, dockerfile: Dockerfile }
    container_name: telconusa-finance-web
    restart: unless-stopped
    ports: ["3004:3004"]
    environment:
      NEXT_PUBLIC_FINANCE_API_URL: http://localhost:8004
      NEXT_PUBLIC_HRM_API_URL: http://localhost:8002
      NEXT_PUBLIC_HRM_WEB_URL: http://localhost:3002
    depends_on: [finance-api, hrm-api]

  # --- Mock server per track (hanya aktif dengan --profile mock) ---
  mock-crm:
    image: stoplight/prism:5
    container_name: telconusa-mock-crm
    profiles: ["mock"]
    command: mock -h 0.0.0.0 -p 4010 /contracts/openapi/crm.yaml
    volumes:
      - ./contracts:/contracts:ro
    ports: ["9001:4010"]

  mock-hrm:
    image: stoplight/prism:5
    container_name: telconusa-mock-hrm
    profiles: ["mock"]
    command: mock -h 0.0.0.0 -p 4010 /contracts/openapi/hrm.yaml
    volumes:
      - ./contracts:/contracts:ro
    ports: ["9002:4010"]

  mock-scm:
    image: stoplight/prism:5
    container_name: telconusa-mock-scm
    profiles: ["mock"]
    command: mock -h 0.0.0.0 -p 4010 /contracts/openapi/scm.yaml
    volumes:
      - ./contracts:/contracts:ro
    ports: ["9003:4010"]

  mock-finance:
    image: stoplight/prism:5
    container_name: telconusa-mock-finance
    profiles: ["mock"]
    command: mock -h 0.0.0.0 -p 4010 /contracts/openapi/finance.yaml
    volumes:
      - ./contracts:/contracts:ro
    ports: ["9004:4010"]

volumes:
  mysql_data:
